name: Setup Java
description: Install the JDK used across Mobility Data Space Gradle builds.

inputs:
  java-version:
    description: The Java version to install.
    required: false
    default: '25'
  distribution:
    description: The JDK distribution to install.
    required: false
    default: 'temurin'

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }} (${{ inputs.distribution }})
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
